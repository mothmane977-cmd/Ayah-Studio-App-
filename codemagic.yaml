workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    working_directory: flutter_quran_reels
    scripts:
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - flutter_quran_reels/build/app/outputs/flutter-apk/*.apk
